name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q skill/scripts tasks.py

      - name: 14 套主题 × 13 个版式全部 lint（error 必须为 0）
        run: python tasks.py verify --out-dir /tmp/verify

      - name: 主题样张也能过 lint
        run: |
          python tasks.py sheet --out /tmp/sheet.pptx
          python tasks.py lint /tmp/sheet.pptx

      - name: 渲染器缺失时给出可操作的提示（别抛 traceback）
        run: |
          set +e
          out=$(python tasks.py render /tmp/sheet.pptx --engine soffice --out-dir /tmp/nope 2>&1)
          rc=$?
          echo "$out"
          case "$rc:$out" in
            2:*"找不到可用的渲染器"*|0:*"PNG"*|2:*"输出目录已存在"*) echo "OK" ;;
            *) echo "渲染失败路径的输出不对（rc=$rc）"; exit 1 ;;
          esac

      - name: 打包产物（失败时人工看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-deck-py${{ matrix.python }}
          path: |
            /tmp/sheet.pptx
            /tmp/verify/**/*.pptx
          if-no-files-found: ignore
